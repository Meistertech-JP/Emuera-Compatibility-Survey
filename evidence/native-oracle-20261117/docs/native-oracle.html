function show(){let end=Math.min(shown+30,matches.length);for(;shown<end;shown++)out.append(card(matches[shown]));more.hidden=shown>=matches.length}
function update(){let ts=q.value.toLowerCase().trim().split(/\s+/).filter(Boolean),f=filter.value;matches=rows.filter(r=>(exact.checked&&q.value.trim()?r.id.toLowerCase()===q.value.toLowerCase().trim():ts.every(t=>r._search.includes(t)))&&(f==='all'||f==='native'&&(r.reach_state==='recorded_projection_without_raw'||r.native.some(m=>m.assets.some(a=>['raw','history','native_log','image','image_before','image_after'].includes(a.role))))||f==='image'&&r.native.some(m=>m.assets.some(a=>a.role.startsWith('image')))||f==='difference'&&['different','different_scoped','mismatch'].includes(r.comparison)&&r.difference_attributed_to_case===true||f==='unknown'&&r.reach_state==='unconfirmed'));if(ts.length)matches.sort((a,b)=>ts.reduce((s,t)=>s+(b._name.includes(t)?1:0)-(a._name.includes(t)?1:0),0));out.replaceChildren();shown=0;count.textContent=' '+matches.length;show()}
function setlang(){let d=dict[lang],value=filter.value||'all';document.documentElement.lang=lang;document.querySelector('#title').textContent=d.title;document.querySelector('#intro').textContent=d.intro;document.querySelector('#note').textContent=d.note;q.placeholder=d.input;document.querySelector('#exactLabel').textContent=d.exact;more.textContent=d.more;document.querySelector('#lang').textContent=lang==='ja'?'English':'日本語';filter.replaceChildren();for(const k of ['all','native','image','difference','unknown']){let x=el('option',d[k]);x.value=k;filter.append(x)}filter.value=value;update()}
let timer;q.addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(update,100)});filter.addEventListener('change',update);exact.addEventListener('change',update);more.addEventListener('click',show);document.querySelector('#lang').addEventListener('click',()=>{lang=lang==='ja'?'en':'ja';setlang()});setlang()})();
</script></body></html>
